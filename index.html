<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tivals Music | Powered by tivalsdeveloper</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#080b12;color:white;padding-bottom:72px}.nav{position:sticky;top:0;z-index:10;padding:14px 5%;display:flex;gap:15px;align-items:center;background:#080b12;border-bottom:1px solid #283044}.brand{font-weight:900}.search{flex:1;max-width:600px;margin:auto}.search input{width:100%;padding:12px 16px;border-radius:24px;border:1px solid #35405a;background:#121824;color:white}.hero,.music{max-width:1200px;margin:auto;padding:45px 5%}.hero h1{font-size:clamp(40px,8vw,72px);margin:0}.hero p{color:#9ba8bd}.gradient{background:linear-gradient(90deg,#9b86ff,#32dcff);-webkit-background-clip:text;color:transparent}.tabs,.filters{display:flex;gap:9px;overflow:auto;margin:25px 0}.btn{border:1px solid #35405a;background:#121824;color:#e2e8f2;border-radius:999px;padding:10px 15px;white-space:nowrap;cursor:pointer}.btn.active{background:#7657ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:#111722;border:1px solid #283249;border-radius:18px;padding:13px}.video{aspect-ratio:16/9;border-radius:13px;overflow:hidden;background:#000}.video iframe{width:100%;height:100%;border:0}.meta{display:flex;justify-content:space-between;gap:8px}.card h3{margin:12px 0 3px}.card p{margin:0;color:#8d9bb0;font-size:13px}.heart{border:0;background:#252e42;color:white;width:38px;height:38px;border-radius:50%;margin-top:9px;cursor:pointer}.heart.saved{background:#7657ff}.empty{display:none;text-align:center;padding:40px;color:#8593a8}.nowbar{position:fixed;bottom:0;left:0;right:0;z-index:25;height:68px;background:#111722;border-top:1px solid #30394d;display:flex;align-items:center;gap:12px;padding:8px 4%}.note{width:46px;height:46px;border-radius:10px;background:#7657ff;display:grid;place-items:center;font-size:22px}.now{flex:1;min-width:0}.now strong,.now span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now span{font-size:12px;color:#8d9bb0}.skip{border:1px solid #39445c;background:#20283a;color:white;border-radius:50%;width:40px;height:40px;cursor:pointer}footer{text-align:center;padding:25px;color:#66758c}@media(max-width:600px){.nav,.hero,.music{padding-left:14px;padding-right:14px}.brand{font-size:13px}.grid{grid-template-columns:1fr}.nowbar{padding:8px 12px}}</style></head><body><nav class="nav"><div class="brand">Tivals Music</div><div class="search"><input id="search" placeholder="Search music or artist"></div></nav><header class="hero"><h1>Music meets <span class="gradient">Tivals AI.</span></h1><p>Search music, save favorites, build your library and discover more.</p><div class="tabs"><button class="btn tab active" data-view="discover">Discover</button><button class="btn tab" data-view="favorites">Favorites</button><button class="btn tab" data-view="recent">Recently watched</button><button class="btn tab" data-view="playlist">My Library</button></div></header><main class="music"><div class="filters"><button class="btn filter active" data-filter="all">All</button><button class="btn filter" data-filter="kpop">K-Pop</button><button class="btn filter" data-filter="afrobeats">Afrobeats</button><button class="btn filter" data-filter="amapiano">Amapiano</button><button class="btn filter" data-filter="international">International</button></div><h2 id="heading">Recommended for you</h2><div class="grid" id="grid"></div><div class="empty" id="empty">No music found.</div></main><footer>Powered by tivalsdeveloper</footer><div class="nowbar"><div class="note">♪</div><div class="now"><strong id="nowTitle">Choose a music video</strong><span id="nowArtist">Tivals Music</span></div><button class="skip" id="prev">‹</button><button class="skip" id="next">›</button></div><script>const songs=[{id:'gdZLi9oWNZg',title:'Dynamite',artist:'BTS',genre:'kpop'},{id:'lPe09eE6Xio',title:'Last Last',artist:'Burna Boy',genre:'afrobeats'},{id:'9LMCF8x2zss',title:'SETE',artist:'K.O ft Young Stunna & Blxckie',genre:'amapiano'},{id:'kJQP7kiw5Fk',title:'Despacito',artist:'Luis Fonsi',genre:'international'},{id:'4NRXx6U8ABQ',title:'Blinding Lights',artist:'The Weeknd',genre:'international'},{id:'gQlMMD8auMs',title:'Pink Venom',artist:'BLACKPINK',genre:'kpop'}];let view='discover',genre='all',current=0;const read=k=>JSON.parse(localStorage.getItem(k)||'[]'),write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));function fav(id){let a=read('tmFav');a=a.includes(id)?a.filter(x=>x!==id):a.concat(id);write('tmFav',a);render()}function playlist(id){let a=read('tmList');a=a.includes(id)?a.filter(x=>x!==id):a.concat(id);write('tmList',a);render()}function choose(id){current=songs.findIndex(s=>s.id===id);let s=songs[current];nowTitle.textContent=s.title;nowArtist.textContent=s.artist;let a=read('tmRecent').filter(x=>x!==id);a.unshift(id);write('tmRecent',a.slice(0,20))}function render(){let f=read('tmFav'),r=read('tmRecent'),p=read('tmList'),q=search.value.toLowerCase();let a=songs.filter(s=>(genre==='all'||s.genre===genre)&&(s.title+' '+s.artist).toLowerCase().includes(q));if(view==='favorites')a=a.filter(s=>f.includes(s.id));if(view==='recent')a=a.filter(s=>r.includes(s.id));if(view==='playlist')a=a.filter(s=>p.includes(s.id));heading.textContent={discover:'Recommended for you',favorites:'Favorites',recent:'Recently Watched',playlist:'My Music Library'}[view];grid.innerHTML=a.map(s=>`<article class="card"><div class="video" onclick="choose('${s.id}')"><iframe src="https://www.youtube-nocookie.com/embed/${s.id}" title="${s.title}" loading="lazy" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><div class="meta"><div><h3>${s.title}</h3><p>${s.artist} · ${s.genre}</p></div><button class="heart ${f.includes(s.id)?'saved':''}" onclick="fav('${s.id}')">♥</button></div><button class="btn" onclick="playlist('${s.id}')">${p.includes(s.id)?'✓ In library':'+ Library'}</button></article>`).join('');empty.style.display=a.length?'none':'block'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');genre=b.dataset.filter;render()});search.oninput=render;next.onclick=()=>{current=(current+1)%songs.length;choose(songs[current].id)};prev.onclick=()=>{current=(current-1+songs.length)%songs.length;choose(songs[current].id)};render();</script><script src="https://tivalsdeveloper.github.io/tivals-ai/widget.js" data-name="Tivals AI" data-position="right" data-welcome="Hi! How can I help?"></script></body></html>
